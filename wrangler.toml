name = "sketchnote"
main = "worker.js"
compatibility_date = "2025-05-01"

[build]
command = "npm run build"

[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = true

# Claude-Modell – wird bei jedem Build aus GitHub gesetzt.
# Im Cloudflare-Dashboard geänderte Werte würden beim nächsten Push überschrieben.
[vars]
CLAUDE_MODEL = "claude-sonnet-5-5"
CLAUDE_MODEL_FALLBACK = "claude-sonnet-4-6"

# Begrenzung: höchstens 10 KI-Anfragen pro Minute und IP-Adresse
[[ratelimits]]
name = "KI_LIMIT"
namespace_id = "2003"

  [ratelimits.simple]
  limit = 10
  period = 60

# Secret ACCESS_CODE (Zugangscode) wird im Dashboard gesetzt, nicht hier.
